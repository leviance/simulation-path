<div id="desk" class="sheet survey">
    <h1 id="title">NEIGHBOR SURVEY</h1>
    <div id="settings" class="parameters">
        <label id="radius-value">Survey radius</label>
        <input id="radius" type="range" min="20" max="140" step="2" value="64" />
        <button id="observe">Neighbors</button>
        <label id="separation-value">Separation</label>
        <input id="separation" type="range" min="0" max="5" step="0.1" value="1.5" />
    </div>
    <div id="actions" class="tools">
        <button id="pause">Pause flight</button>
        <button id="reset">Reset flock</button>
    </div>
    <span id="ticks">Clock</span>
</div>
