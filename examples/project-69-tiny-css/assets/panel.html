<div id="desk" class="sheet">
    <h1>FLOCK STUDIO / LIVE</h1>
    <div id="tools" class="group">
        <button id="pause" class="action primary">Pause flight</button>
        <button id="reset" class="action">Reset flock</button>
        <button id="observe" class="action">Neighbors</button>
    </div>
    <div id="settings" class="group">
        <label id="radius-value">Radius</label>
        <input id="radius" type="range" min="20" max="140" step="2" value="64" />
        <label id="separation-value">Separation</label>
        <input id="separation" type="range" min="0" max="5" step="0.1" value="1.5" />
    </div>
    <span id="ticks">Clock</span>
</div>
