<div id="desk" class="sheet">
    <h1>PROGRAMMABLE FLIGHT DESK</h1>
    <div id="tools" class="toolbar">
        <button id="pause">Pause</button>
        <button id="reset">Reset</button>
        <input id="observe" type="checkbox" label="Links" />
    </div>
    <div id="params" class="group">
        <label id="radius-value">Radius</label>
        <input type="range" id="radius" min="20" max="140" step="2" value="64" />
        <label id="separation-value">Separation</label>
        <input type="range" id="separation" min="0" max="5" step="0.1" value="1.5" />
    </div>
    <span id="ticks">Clock</span>
</div>
